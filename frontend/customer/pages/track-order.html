<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order — WoollyCraft</title><link rel="stylesheet" href="/customer/assets/store.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="/">🧶 WoollyCraft</a><nav class="navlinks"><a href="/">Home</a><a href="/customer/pages/shop.html">Shop</a><a href="/customer/pages/wishlist.html">♡ Wishlist</a><a href="/customer/pages/cart.html">🛒 Cart <span data-count>0</span></a><a href="/customer/pages/orders.html">Orders</a><a href="/customer/pages/profile.html">Account</a></nav></div></header><main class="container page"><span class="eyebrow">DELIVERY</span><h1>Track Order</h1><div id="track" class="panel"><form id="trackForm"><label>Order ID<input id="orderId" required placeholder="Your order ID"></label><label>Delhivery AWB / Waybill<input id="awb" placeholder="Enter AWB if available"></label><button class="btn primary">Track shipment</button></form><div id="trackResult"></div></div><script>document.getElementById("trackForm").addEventListener("submit",async e=>{e.preventDefault();let id=document.getElementById("orderId").value.trim(),awb=document.getElementById("awb").value.trim();try{let o=await (await fetch("/api/orders/"+encodeURIComponent(id))).json();if(!o.order)throw Error(o.error||"Order not found");if(!awb)awb=o.order.awb||"";let html="<h2>"+o.order.id+"</h2><p>Order status: <b>"+o.order.status+"</b></p>";if(awb){let tr=await (await fetch("/api/track/"+encodeURIComponent(awb))).json();if(tr.error)html+="<p class=error>"+tr.error+"</p>";else html+="<h3>Delhivery shipment</h3><pre style="white-space:pre-wrap">"+JSON.stringify(tr.data,null,2)+"</pre>"}else html+="<p>Your Delhivery AWB will appear here after shipment is manifested.</p>";document.getElementById("trackResult").innerHTML=html}catch(x){document.getElementById("trackResult").innerHTML="<p class=error>"+x.message+"</p>"}});const qp=new URLSearchParams(location.search);if(qp.get("id"))document.getElementById("orderId").value=qp.get("id");if(qp.get("awb"))document.getElementById("awb").value=qp.get("awb");</script></main><footer class="footer"><div class="container"><b>🧶 WoollyCraft</b><p>Little handmade things, made to make you smile.</p></div></footer><nav class="mobile"><a href="/">🏠<br>Home</a><a href="/customer/pages/shop.html">🛍<br>Shop</a><a href="/customer/pages/wishlist.html">♡<br>Wish</a><a href="/customer/pages/cart.html">🛒<br>Cart</a><a href="/customer/pages/profile.html">👤<br>Account</a></nav><script src="/customer/components/store.js"></script></body></html>
