<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders — WoollyCraft</title><link rel="stylesheet" href="/customer/assets/store.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="/">🧶 WoollyCraft</a><nav class="navlinks"><a href="/">Home</a><a href="/customer/pages/shop.html">Shop</a><a href="/customer/pages/wishlist.html">♡ Wishlist</a><a href="/customer/pages/cart.html">🛒 Cart <span data-count>0</span></a><a href="/customer/pages/orders.html">Orders</a><a href="/customer/pages/profile.html">Account</a></nav></div></header><main class="container page"><span class="eyebrow">ACCOUNT</span><h1>My Orders</h1><div id="orders" class="panel">Loading your orders...</div></main><footer class="footer"><div class="container"><b>🧶 WoollyCraft</b><p>Little handmade things, made to make you smile.</p></div></footer><nav class="mobile"><a href="/">🏠<br>Home</a><a href="/customer/pages/shop.html">🛍<br>Shop</a><a href="/customer/pages/wishlist.html">♡<br>Wish</a><a href="/customer/pages/cart.html">🛒<br>Cart</a><a href="/customer/pages/profile.html">👤<br>Account</a></nav><script src="/customer/components/store.js"></script><script>
const cid=localStorage.woolly_customer_id;const moneyO=n=>'₹'+Number(n||0).toLocaleString('en-IN');const escO=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadMyOrders(){const el=document.getElementById('orders');try{const d=await (await fetch('/api/customer/orders?customerId='+encodeURIComponent(cid||''))).json();const orders=d.orders||[];const id=new URLSearchParams(location.search).get('id');if(!orders.length){el.innerHTML='<div class="empty"><h2>No orders yet</h2><a class="btn primary" href="/customer/pages/shop.html">Start shopping</a></div>';return}const selected=id?orders.find(x=>x.id===id):null;if(selected){el.innerHTML=`<div class="order-detail"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h2>${escO(selected.id)}</h2><p>${new Date(selected.createdAt||Date.now()).toLocaleString('en-IN')} · <b>${escO(selected.status||'confirmed')}</b></p></div><a class="btn light" href="/customer/pages/track-order.html?id=${encodeURIComponent(selected.id)}">Track order</a></div><hr>${(selected.items||[]).map(i=>`<a class="cart-row" style="display:flex;text-decoration:none;color:inherit" href="/customer/pages/product.html?id=${encodeURIComponent(i.id)}"><img src="${escO(i.image||'https://placehold.co/120x120')}" alt=""><div style="flex:1"><b>${escO(i.name)}</b><p>Product No: ${escO(i.sku||'—')} · Qty ${i.qty}</p><b>${moneyO(Number(i.price||0)*Number(i.qty||0))}</b><div class="muted">Click to open product →</div></div></a>`).join('')}<div class="summary"><div class="line"><span>Subtotal</span><b>${moneyO(selected.subtotal)}</b></div><div class="line"><span>Shipping</span><b>${moneyO(selected.shipping)}</b></div><div class="line total"><span>Total</span><b>${moneyO(selected.total||selected.amount)}</b></div></div></div>`;return}el.innerHTML=`<div class="order-list">${orders.map(x=>`<div class="mini" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3>${escO(x.id)}</h3><span>${new Date(x.createdAt||Date.now()).toLocaleString('en-IN')} · ${escO(x.status||'confirmed')}</span></div><b>${moneyO(x.total||x.amount)}</b></div><p>${(x.items||[]).length} item(s): ${(x.items||[]).slice(0,3).map(i=>escO(i.name)).join(', ')}</p><div class="actions"><a class="btn primary" href="/customer/pages/orders.html?id=${encodeURIComponent(x.id)}">View items</a><a class="btn light" href="/customer/pages/track-order.html?id=${encodeURIComponent(x.id)}">Track</a></div></div>`).join('')}</div>`}catch(e){el.innerHTML='<p class="error">Unable to load orders.</p>'}}loadMyOrders();
</script></body></html>
