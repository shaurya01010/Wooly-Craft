<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WoollyCraft Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/admin.css"></head><body>
<div id="login" class="login"><div class="login-card"><div class="logo">🧶</div><h1>WoollyCraft Admin</h1><p>Secure store management</p><input id="password" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Sign in</button><div id="loginError" class="error"></div></div></div>
<div id="app" class="admin" hidden><aside><div class="aside-brand">🧶 <b>WoollyCraft</b></div><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="orders">Orders</button><button class="tab" data-tab="products">Products</button><button class="tab" data-tab="trending">Trending slider</button><a href="/" target="_blank">View store ↗</a><button onclick="logout()">Log out</button></aside><section class="main"><div class="mobile-top"><b>WoollyCraft Admin</b></div><div id="overview" class="panel active"><div class="page-head"><div><p>STORE OVERVIEW</p><h1>Dashboard</h1></div><button class="btn" onclick="loadAll()">Refresh</button></div><div class="stats" id="stats"></div><div class="two"><div class="card"><h3>Last 7 days</h3><div id="salesChart" class="bars"></div></div><div class="card"><h3>Best sellers</h3><div id="topProducts"></div></div></div></div><div id="orders" class="panel"><div class="page-head"><div><p>SALES</p><h1>All orders</h1></div><button class="btn" onclick="loadOrders()">Refresh</button></div><div class="filters"><input id="orderSearch" placeholder="Search order ID / phone / name" oninput="renderOrders()"><select id="statusFilter" onchange="renderOrders()"><option value="all">All statuses</option><option>confirmed</option><option>preparing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></div><div id="ordersTable" class="table-wrap"></div></div><div id="products" class="panel"><div class="page-head"><div><p>CATALOG</p><h1>Products</h1></div><button class="btn" onclick="newProduct()">+ Add product</button></div><div class="card"><div class="product-form"><input type="hidden" id="pId"><input id="pName" placeholder="Product name"><input id="pPrice" type="number" placeholder="Price ₹"><input id="pCategory" placeholder="Category"><textarea id="pDesc" placeholder="Description"></textarea><label class="upload">Choose image <input id="pImageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" onchange="previewImage(event)"></label><img id="preview" class="preview" hidden><input id="pImage" placeholder="Image URL" readonly><label class="check"><input id="pActive" type="checkbox" checked> Active</label><button class="btn" onclick="saveProduct()">Save product</button><button class="ghost" onclick="newProduct()">Clear</button><div id="productError" class="error"></div></div></div><div id="productList" class="product-admin-grid"></div></div><div id="trending" class="panel"><div class="page-head"><div><p>HOMEPAGE</p><h1>Trending slider</h1><p>Select up to 5 products. The slider changes every 1.5 seconds.</p></div><button class="btn" onclick="saveTrending()">Save slider</button></div><div id="trendingList" class="trend-admin-grid"></div></div></section></div><script src="js/admin.js"></script></body></html>
